<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8ed">
  <title>Les champions du calcul</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #292449;
      --muted: #716d86;
      --purple: #6d4bd1;
      --purple-dark: #5436b6;
      --paper: #fffdf9;
      --line: #eee9f5;
      --green: #23885c;
      --red: #d94350;
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 8% 12%, #ffe1c9 0, transparent 25%),
        radial-gradient(ellipse at 92% 84%, #e8ddff 0, transparent 26%),
        #fff8ed;
    }

    button { font: inherit; }

    .game {
      width: min(100%, 520px);
      padding: clamp(22px, 5vw, 36px);
      overflow: hidden;
      position: relative;
      border: 1px solid #fff;
      border-radius: 30px;
      background: var(--paper);
      box-shadow: 0 18px 60px #543b7920, 0 3px 12px #543b7910;
      text-align: center;
    }

    .game.is-playing > .eyebrow,
    .game.is-playing > h1,
    .game.is-playing > .subtitle {
      display: none;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--purple);
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 7vw, 2.45rem);
      letter-spacing: -.045em;
      line-height: 1.08;
    }

    .subtitle {
      margin: 10px 0 24px;
      color: var(--muted);
      font-size: .98rem;
    }

    .player-picker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 0 0 20px;
    }

    .player-choice {
      min-height: 78px;
      border: 2px solid var(--line);
      border-radius: 18px;
      color: var(--ink);
      background: #fff;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .15s;
    }

    .player-choice:hover { transform: translateY(-2px); }
    .player-choice[aria-pressed="true"] {
      border-color: var(--purple);
      background: #f4f0ff;
    }

    .player-choice span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 700;
    }

    .primary-button {
      width: 100%;
      min-height: 56px;
      padding: 12px 20px;
      border: 0;
      border-radius: 16px;
      color: #fff;
      background: var(--purple);
      box-shadow: 0 5px 0 var(--purple-dark);
      font-size: 1.08rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform .12s, box-shadow .12s, background .12s;
    }

    .primary-button:hover { background: var(--purple-dark); }
    .primary-button:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--purple-dark); }
    .primary-button:disabled { opacity: .48; cursor: not-allowed; }

    button:focus-visible {
      outline: 3px solid #f4a83a;
      outline-offset: 3px;
    }

    .storage-note {
      min-height: 1.2em;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: .78rem;
    }

    .version {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 700;
    }

    [hidden] { display: none !important; }

    .game-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 23px 0 18px;
    }

    .hud-pill {
      min-width: 105px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #fff;
      text-align: left;
    }

    .hud-label {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .hud-value { font-size: 1.22rem; font-weight: 900; }
    .timer { text-align: right; }
    .timer .hud-value { font-variant-numeric: tabular-nums; }
    .timer.urgent .hud-value { color: var(--red); }

    .problem-card {
      padding: 19px 12px 17px;
      border-radius: 22px;
      background: #f5f1ff;
    }

    .problem-prompt {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: .85rem;
      font-weight: 800;
    }

    .equation {
      margin: 0;
      font-size: clamp(2.8rem, 12vw, 4.1rem);
      font-weight: 1000;
      letter-spacing: -.055em;
      font-variant-numeric: tabular-nums;
    }

    .feedback {
      min-height: 23px;
      margin: 11px 0 13px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 800;
    }

    .feedback.correct { color: var(--green); }
    .feedback.incorrect { color: var(--red); }

    .answers {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 9px;
      container-type: inline-size;
    }

    .answer {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      min-width: 0;
      padding: 0;
      border: 2px solid var(--line);
      border-radius: 15px;
      color: var(--ink);
      background: #fff;
      font-size: clamp(2.2rem, 10vw, 2.76rem);
      font-weight: 900;
      cursor: pointer;
      transition: transform .12s, border-color .12s, background .12s, color .12s;
      -webkit-tap-highlight-color: transparent;
    }

    .answer[data-answer="0"] {
      grid-column: 1 / -1;
      aspect-ratio: 5 / 1;
    }

    @supports (height: 1cqi) {
      .answer[data-answer="0"] {
        aspect-ratio: auto;
        height: calc(20cqi - 7.2px);
      }
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: #b7a4f0;
      background: #faf8ff;
    }

    .answer:disabled { cursor: default; }
    .answer.correct {
      border-color: #8ed3af;
      color: #176f48;
      background: #e8f8ef;
    }
    .answer.wrong {
      border-color: var(--red);
      color: #fff;
      background: var(--red);
      animation: shake .22s ease-in-out 2;
    }

    .end-score {
      margin: 24px 0 5px;
      font-size: 3.5rem;
      font-weight: 1000;
      letter-spacing: -.06em;
    }

    .end-copy { margin: 0 0 20px; color: var(--muted); line-height: 1.5; }
    .surprise {
      margin: 13px 0 19px;
      color: var(--purple);
      font-size: 1.3rem;
      font-weight: 1000;
      animation: pop .45s cubic-bezier(.2, 1.6, .4, 1);
    }

    .confetti-layer {
      position: fixed;
      z-index: 5;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti {
      position: absolute;
      top: var(--y);
      left: var(--x);
      width: var(--size);
      height: calc(var(--size) * 1.35);
      margin: calc(var(--size) * -.5);
      border-radius: 3px;
      background: var(--color);
      animation: burst var(--duration) cubic-bezier(.15, .7, .3, 1) forwards;
    }

    @keyframes shake {
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    @keyframes pop {
      from { transform: scale(.65); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes burst {
      0% { transform: translate(0, 0) scale(.35) rotate(0); opacity: 1; }
      100% { transform: translate(var(--drift), var(--rise)) scale(1) rotate(var(--spin)); opacity: 0; }
    }

    @media (max-width: 380px) {
      .answers { gap: 6px; }
      .answer { border-radius: 12px; }
    }

    @media (max-width: 600px) {
      body {
        min-height: 100vh;
        min-height: 100svh;
        padding: 0;
        place-items: stretch;
      }

      .game {
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        justify-content: center;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .answers { row-gap: clamp(5px, 1.5vw, 9px); }
      .answer {
        min-height: 0;
        font-size: clamp(1.1rem, 9vw, 2rem);
      }

      #play:not([hidden]) {
        display: flex;
        flex: 1;
        min-height: 0;
        flex-direction: column;
        justify-content: center;
      }

      .game-hud { gap: 7px; }
      .hud-pill { min-width: 0; padding: 9px 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      .confetti { animation: none !important; opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="game" aria-labelledby="page-title">
    <p class="eyebrow">Le défi des 5 minutes</p>
    <h1 id="page-title">Les champions<br>du calcul</h1>
    <p class="subtitle">Additions et soustractions jusqu'à 20 !</p>

    <section id="setup" aria-label="Choix du joueur">
      <div class="player-picker">
        <button class="player-choice" type="button" data-player="Zozo" aria-pressed="false">
          Zozo <span>Record : <b id="zozo-record">0</b></span>
        </button>
        <button class="player-choice" type="button" data-player="Gabi" aria-pressed="false">
          Gabi <span>Record : <b id="gabi-record">0</b></span>
        </button>
      </div>
      <button id="start-button" class="primary-button" type="button" disabled>Choisis ton prénom</button>
      <p id="storage-note" class="storage-note" role="status" aria-live="polite"></p>
      <p class="version">Version 1</p>
    </section>

    <section id="play" hidden aria-label="Partie en cours">
      <div class="game-hud">
        <div class="hud-pill">
          <span class="hud-label">Joueur</span>
          <span id="current-player" class="hud-value"></span>
        </div>
        <div class="hud-pill">
          <span class="hud-label">Points</span>
          <span id="score" class="hud-value" aria-live="polite">0</span>
        </div>
        <div id="timer" class="hud-pill timer">
          <span class="hud-label">Temps</span>
          <span id="time-left" class="hud-value" role="timer" aria-live="off">5:00</span>
        </div>
      </div>
      <div class="problem-card">
        <p class="problem-prompt">Combien ça fait ?</p>
        <p id="equation" class="equation" aria-live="polite"></p>
      </div>
      <p id="feedback" class="feedback" role="status" aria-live="polite">Appuie sur la bonne réponse !</p>
      <div id="answers" class="answers" aria-label="Choisis une réponse"></div>
    </section>

    <section id="results" hidden aria-live="polite">
      <p class="eyebrow">Temps écoulé !</p>
      <p id="end-score" class="end-score">0</p>
      <p id="end-copy" class="end-copy"></p>
      <p id="surprise" class="surprise" hidden>Un point surprise !</p>
      <button id="again-button" class="primary-button" type="button">Rejouer</button>
    </section>
  </main>
  <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>

  <script>
    (() => {
      const ROUND_SECONDS = 5 * 60;
      const STORAGE_PREFIX = "math-game-high-score-";
      const MISSED_PROBLEMS_PREFIX = "math-game-missed-problems-";
      const COLORS = ["#ff6b6b", "#ffb84d", "#55c99a", "#8b6ce0", "#4bb9e8", "#ff77a8"];
      const setup = document.querySelector("#setup");
      const play = document.querySelector("#play");
      const results = document.querySelector("#results");
      const gameCard = document.querySelector(".game");
      const startButton = document.querySelector("#start-button");
      const scoreDisplay = document.querySelector("#score");
      const equationDisplay = document.querySelector("#equation");
      const feedback = document.querySelector("#feedback");
      const answers = document.querySelector("#answers");
      const currentPlayerDisplay = document.querySelector("#current-player");
      const timeDisplay = document.querySelector("#time-left");
      const timerPill = document.querySelector("#timer");
      const storageNote = document.querySelector("#storage-note");
      const confettiLayer = document.querySelector("#confetti-layer");
      let selectedPlayer = "";
      let score = 0;
      let correctAnswer = 0;
      let deadline = 0;
      let timerInterval = 0;
      let answerLocked = false;
      let gameActive = false;
      let missedProblems = [];
      let reviewProblems = [];
      let currentProblem = null;

      function readHighScore(player) {
        try {
          const value = Number(localStorage.getItem(STORAGE_PREFIX + player));
          return Number.isSafeInteger(value) && value >= 0 ? value : 0;
        } catch (error) {
          storageNote.textContent = "Les records ne peuvent pas être lus sur cet appareil.";
          return 0;
        }
      }

      function saveHighScore(player, value) {
        try {
          localStorage.setItem(STORAGE_PREFIX + player, String(value));
          return true;
        } catch (error) {
          storageNote.textContent = "Partie jouée, mais le record n'a pas pu être enregistré.";
          return false;
        }
      }

      function isValidProblem(problem) {
        if (!problem || !Number.isSafeInteger(problem.a) || !Number.isSafeInteger(problem.b)
          || !Number.isSafeInteger(problem.answer) || problem.a < 0 || problem.a > 20
          || problem.b < 0 || problem.b > 20) {
          return false;
        }
        if (problem.operator === "+") {
          return problem.a + problem.b <= 20 && problem.answer === problem.a + problem.b;
        }
        if (problem.operator === "-") {
          return problem.b <= problem.a && problem.answer === problem.a - problem.b;
        }
        return false;
      }

      function sameProblem(first, second) {
        return first.a === second.a && first.b === second.b && first.operator === second.operator;
      }

      function readMissedProblems(player) {
        try {
          const stored = localStorage.getItem(MISSED_PROBLEMS_PREFIX + player);
          if (stored === null) return [];
          const problems = JSON.parse(stored);
          if (!Array.isArray(problems)) throw new Error("Invalid saved problems");
          return problems.filter(isValidProblem);
        } catch (error) {
          storageNote.textContent = "Les réponses à retravailler ne peuvent pas être lues sur cet appareil.";
          return [];
        }
      }

      function saveMissedProblems(player) {
        try {
          localStorage.setItem(MISSED_PROBLEMS_PREFIX + player, JSON.stringify(missedProblems));
          return true;
        } catch (error) {
          storageNote.textContent = "Les réponses à retravailler n'ont pas pu être enregistrées.";
          return false;
        }
      }

      function rememberMissedProblem(problem) {
        if (missedProblems.some((missed) => sameProblem(missed, problem))) return;
        missedProblems.push(problem);
        saveMissedProblems(selectedPlayer);
      }

      function resolveMissedProblem(problem) {
        const remaining = missedProblems.filter((missed) => !sameProblem(missed, problem));
        if (remaining.length === missedProblems.length) return;
        missedProblems = remaining;
        reviewProblems = reviewProblems.filter((missed) => !sameProblem(missed, problem));
        saveMissedProblems(selectedPlayer);
      }

      function refreshRecords() {
        document.querySelector("#zozo-record").textContent = readHighScore("Zozo");
        document.querySelector("#gabi-record").textContent = readHighScore("Gabi");
      }

      document.querySelectorAll(".player-choice").forEach((button) => {
        button.addEventListener("click", () => {
          selectedPlayer = button.dataset.player;
          document.querySelectorAll(".player-choice").forEach((choice) => {
            choice.setAttribute("aria-pressed", String(choice === button));
          });
          startButton.disabled = false;
          startButton.textContent = `Commencer avec ${selectedPlayer} !`;
        });
      });

      function makeProblem() {
        if (reviewProblems.length > 0) {
          currentProblem = reviewProblems.shift();
          correctAnswer = currentProblem.answer;
          equationDisplay.textContent = `${currentProblem.a} ${currentProblem.operator === "+" ? "+" : "−"} ${currentProblem.b} = ?`;
          return;
        }

        const isAddition = Math.random() < 0.5;
        let a;
        let b;
        let operator;
        if (isAddition) {
          a = Math.floor(Math.random() * 21);
          b = Math.floor(Math.random() * (21 - a));
          operator = "+";
          correctAnswer = a + b;
        } else {
          a = Math.floor(Math.random() * 21);
          b = Math.floor(Math.random() * (a + 1));
          operator = "-";
          correctAnswer = a - b;
        }
        currentProblem = { a, b, operator, answer: correctAnswer };
        equationDisplay.textContent = `${a} ${isAddition ? "+" : "−"} ${b} = ?`;
      }

      function showConfetti(amount, source) {
        const bounds = source?.getBoundingClientRect();
        const originX = bounds ? bounds.left + bounds.width / 2 : window.innerWidth / 2;
        const originY = bounds ? bounds.top + bounds.height / 2 : window.innerHeight / 3;
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        for (let index = 0; index < amount; index += 1) {
          const piece = document.createElement("span");
          piece.className = "confetti";
          const angle = Math.random() * Math.PI * 2;
          const distance = 55 + Math.random() * 100;
          const driftX = Math.cos(angle) * distance;
          const driftY = Math.sin(angle) * distance;
          piece.style.setProperty("--x", `${originX + (reduceMotion ? driftX : 0)}px`);
          piece.style.setProperty("--y", `${originY + (reduceMotion ? driftY : 0)}px`);
          piece.style.setProperty("--size", `${8 + Math.random() * 6}px`);
          piece.style.setProperty("--color", COLORS[Math.floor(Math.random() * COLORS.length)]);
          piece.style.setProperty("--duration", `${0.65 + Math.random() * 0.45}s`);
          piece.style.setProperty("--drift", `${driftX}px`);
          piece.style.setProperty("--rise", `${driftY}px`);
          piece.style.setProperty("--spin", `${Math.random() * 900 - 450}deg`);
          confettiLayer.append(piece);
          piece.addEventListener("animationend", () => piece.remove(), { once: true });
          window.setTimeout(() => piece.remove(), 1200);
        }
      }

      function nextProblem() {
        if (!gameActive) return;
        answerLocked = false;
        feedback.textContent = "Appuie sur la bonne réponse !";
        feedback.className = "feedback";
        makeProblem();
        answers.querySelectorAll("button").forEach((button) => {
          button.disabled = false;
          button.className = "answer";
        });
      }

      function answerQuestion(event) {
        const button = event.target.closest("button.answer");
        if (!button || answerLocked || !gameActive) return;
        if (Date.now() >= deadline) {
          finishGame();
          return;
        }
        answerLocked = true;
        const chosenAnswer = Number(button.dataset.answer);
        answers.querySelectorAll("button").forEach((answerButton) => {
          answerButton.disabled = true;
        });

        if (chosenAnswer === correctAnswer) {
          score += 1;
          scoreDisplay.textContent = score;
          resolveMissedProblem(currentProblem);
          button.classList.add("correct");
          feedback.textContent = "Bravo !";
          feedback.className = "feedback correct";
          window.setTimeout(nextProblem, 900);
        } else {
          rememberMissedProblem(currentProblem);
          button.classList.add("wrong");
          feedback.textContent = `Oups ! La réponse était ${correctAnswer}.`;
          feedback.className = "feedback incorrect";
          window.setTimeout(nextProblem, 900);
        }
      }

      function buildAnswerGrid() {
        answers.replaceChildren();
        for (let value = 0; value <= 20; value += 1) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "answer";
          button.dataset.answer = value;
          button.textContent = value;
          button.setAttribute("aria-label", `Répondre ${value}`);
          answers.append(button);
        }
      }

      function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = seconds % 60;
        return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
      }

      function updateTimer() {
        const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
        timeDisplay.textContent = formatTime(remaining);
        timerPill.classList.toggle("urgent", remaining <= 30);
        if (remaining === 0) finishGame();
      }

      function startGame() {
        if (!selectedPlayer) return;
        score = 0;
        scoreDisplay.textContent = "0";
        currentPlayerDisplay.textContent = selectedPlayer;
        setup.hidden = true;
        results.hidden = true;
        play.hidden = false;
        gameCard.classList.add("is-playing");
        gameActive = true;
        answerLocked = false;
        missedProblems = readMissedProblems(selectedPlayer);
        reviewProblems = [...missedProblems];
        deadline = Date.now() + ROUND_SECONDS * 1000;
        buildAnswerGrid();
        nextProblem();
        updateTimer();
        timerInterval = window.setInterval(updateTimer, 200);
      }

      function finishGame() {
        if (!gameActive) return;
        gameActive = false;
        answerLocked = true;
        window.clearInterval(timerInterval);
        play.hidden = true;
        gameCard.classList.remove("is-playing");
        results.hidden = false;
        document.querySelector("#end-score").textContent = score;
        const oldRecord = readHighScore(selectedPlayer);
        const brokeRecord = score > oldRecord;
        document.querySelector("#end-copy").textContent = brokeRecord
          ? `Bravo ${selectedPlayer} ! Ton ancien record était de ${oldRecord} ${oldRecord === 1 ? "point" : "points"}.`
          : `Bien joué ${selectedPlayer} ! Ton record reste à ${oldRecord} ${oldRecord === 1 ? "point" : "points"}.`;
        document.querySelector("#surprise").hidden = !brokeRecord;
        if (brokeRecord) {
          saveHighScore(selectedPlayer, score);
          refreshRecords();
          showConfetti(100);
        }
      }

      startButton.addEventListener("click", startGame);
      answers.addEventListener("click", answerQuestion);
      document.querySelector("#again-button").addEventListener("click", () => {
        results.hidden = true;
        setup.hidden = false;
        refreshRecords();
      });

      refreshRecords();
    })();
  </script>
</body>
</html>
